---
- name: Provision identical AWS infrastructure using Ansible
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-west-1
    project_name: ansible-comparison

    vpc_cidr: "10.0.0.0/16"
    public_a_cidr: "10.0.1.0/24"
    public_b_cidr: "10.0.2.0/24"
    private_a_cidr: "10.0.3.0/24"
    private_b_cidr: "10.0.4.0/24"

    az_a: eu-west-1a
    az_b: eu-west-1b

    ami_id: ami-0ada9eff90324cb27
    instance_type: t3.micro

    db_username: adminuser
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"

  tasks:

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ project_name }}-vpc"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ region }}"
        dns_hostnames: true
        dns_support: true
        state: present
      register: vpc

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        state: present
        tags:
          Name: "{{ project_name }}-igw"
      register: igw

    - name: Create public subnet A
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_a_cidr }}"
        az: "{{ az_a }}"
        region: "{{ region }}"
        map_public: true
        state: present
        tags:
          Name: "{{ project_name }}-public-a"
      register: public_a

    - name: Create public subnet B
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_b_cidr }}"
        az: "{{ az_b }}"
        region: "{{ region }}"
        map_public: true
        state: present
        tags:
          Name: "{{ project_name }}-public-b"
      register: public_b

    - name: Create private subnet A
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_a_cidr }}"
        az: "{{ az_a }}"
        region: "{{ region }}"
        state: present
        tags:
          Name: "{{ project_name }}-private-a"
      register: private_a

    - name: Create private subnet B
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_b_cidr }}"
        az: "{{ az_b }}"
        region: "{{ region }}"
        state: present
        tags:
          Name: "{{ project_name }}-private-b"
      register: private_b

    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        subnets:
          - "{{ public_a.subnet.id }}"
          - "{{ public_b.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "{{ project_name }}-public-rt"
        state: present

    - name: Create NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        subnet_id: "{{ public_a.subnet.id }}"
        region: "{{ region }}"
        wait: true
        state: present
        if_exist_do_not_create: true
      register: nat

    - name: Create private route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        subnets:
          - "{{ private_a.subnet.id }}"
          - "{{ private_b.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            nat_gateway_id: "{{ nat.nat_gateway_id }}"
        tags:
          Name: "{{ project_name }}-private-rt"
        state: present

    - name: Create ALB security group
      amazon.aws.ec2_security_group:
        name: "{{ project_name }}-alb-sg"
        description: ALB security group
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            ports:
              - 80
            cidr_ip: 0.0.0.0/0
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      register: alb_sg

    - name: Create EC2 security group
      amazon.aws.ec2_security_group:
        name: "{{ project_name }}-ec2-sg"
        description: EC2 security group
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            ports:
              - 80
            group_id: "{{ alb_sg.group_id }}"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      register: ec2_sg

    - name: Create RDS security group
      amazon.aws.ec2_security_group:
        name: "{{ project_name }}-rds-sg"
        description: RDS security group
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        rules:
          - proto: tcp
            ports:
              - 3306
            group_id: "{{ ec2_sg.group_id }}"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      register: rds_sg

    - name: Create S3 bucket
      amazon.aws.s3_bucket:
        name: "{{ project_name }}-bucket-fahim-20115491"
        region: "{{ region }}"
        state: present
      register: s3_bucket

    - name: Create IAM role for EC2
      amazon.aws.iam_role:
        name: "{{ project_name }}-ec2-role"
        assume_role_policy_document: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "ec2.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        state: present

    - name: Create IAM instance profile
      amazon.aws.iam_instance_profile:
        name: "{{ project_name }}-profile"
        role: "{{ project_name }}-ec2-role"
        state: present

    - name: Create ALB target group
      community.aws.elb_target_group:
        name: "{{ project_name }}-tg"
        protocol: http
        port: 80
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ region }}"
        target_type: instance
        health_check_protocol: HTTP
        health_check_path: /
        successful_response_codes: "200"
        state: present
      register: target_group

    - name: Create Application Load Balancer
      amazon.aws.elb_application_lb:
        name: "{{ project_name }}-alb"
        region: "{{ region }}"
        security_groups:
          - "{{ alb_sg.group_id }}"
        subnets:
          - "{{ public_a.subnet.id }}"
          - "{{ public_b.subnet.id }}"
        listeners:
          - Protocol: HTTP
            Port: 80
            DefaultActions:
              - Type: forward
                TargetGroupArn: "{{ target_group.target_group_arn }}"
        state: present
      register: alb

    - name: Create launch template
      amazon.aws.ec2_launch_template:
        name: "{{ project_name }}-lt"
        region: "{{ region }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        user_data: "{{ lookup('file', 'files/user_data.sh') | b64encode }}"
        security_group_ids:
          - "{{ ec2_sg.group_id }}"
        iam_instance_profile: "{{ project_name }}-profile"
        state: present
      register: launch_template

    - name: Create Auto Scaling Group
      amazon.aws.autoscaling_group:
        name: "{{ project_name }}-asg"
        region: "{{ region }}"
        min_size: 2
        max_size: 4
        desired_capacity: 2
        vpc_zone_identifier:
          - "{{ private_a.subnet.id }}"
          - "{{ private_b.subnet.id }}"
        target_group_arns:
          - "{{ target_group.target_group_arn }}"
        launch_template:
          launch_template_name: "{{ project_name }}-lt"
          version: "$Latest"
        health_check_type: ELB
        health_check_period: 300
        state: present
      register: asg

    - name: Create RDS subnet group
      amazon.aws.rds_subnet_group:
        name: "{{ project_name }}-db-subnet-group"
        description: RDS private subnet group
        region: "{{ region }}"
        subnets:
          - "{{ private_a.subnet.id }}"
          - "{{ private_b.subnet.id }}"
        state: present

    - name: Create RDS MySQL instance
      amazon.aws.rds_instance:
        db_instance_identifier: "{{ project_name }}-mysql"
        region: "{{ region }}"
        engine: mysql
        engine_version: "8.0"
        db_instance_class: db.t3.micro
        allocated_storage: 20
        master_username: "{{ db_username }}"
        master_user_password: "{{ db_password }}"
        db_subnet_group_name: "{{ project_name }}-db-subnet-group"
        vpc_security_group_ids:
          - "{{ rds_sg.group_id }}"
        publicly_accessible: false
        state: present
        wait: true

    - name: Create CloudWatch CPU alarm
      amazon.aws.cloudwatch_metric_alarm:
        name: "{{ project_name }}-cpu-high"
        namespace: AWS/EC2
        metric: CPUUtilization
        statistic: Average
        comparison: GreaterThanThreshold
        threshold: 70
        period: 60
        evaluation_periods: 2
        description: High CPU alarm for EC2 instances
        region: "{{ region }}"
        state: present

    - name: Show outputs
      ansible.builtin.debug:
        msg:
          - "ALB DNS: {{ alb.dns_name | default('Check AWS Console') }}"
          - "S3 Bucket: {{ project_name }}-bucket-fahim-20115491"
          - "VPC ID: {{ vpc.vpc.id }}"
