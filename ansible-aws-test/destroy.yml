---
- name: Destroy Ansible AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-west-1
    project_name: ansible-comparison
    bucket_name: "{{ project_name }}-bucket-fahim-20115491"

  tasks:

    - name: Delete CloudWatch CPU alarm
      amazon.aws.cloudwatch_metric_alarm:
        name: "{{ project_name }}-cpu-high"
        region: "{{ region }}"
        state: absent
      ignore_errors: true

    - name: Delete Auto Scaling Group
      amazon.aws.autoscaling_group:
        name: "{{ project_name }}-asg"
        region: "{{ region }}"
        min_size: 0
        max_size: 0
        desired_capacity: 0
        force_delete: true
        state: absent
      ignore_errors: true

    - name: Delete Application Load Balancer
      amazon.aws.elb_application_lb:
        name: "{{ project_name }}-alb"
        region: "{{ region }}"
        state: absent
      ignore_errors: true

    - name: Delete Target Group
      community.aws.elb_target_group:
        name: "{{ project_name }}-tg"
        region: "{{ region }}"
        state: absent
      ignore_errors: true

    - name: Delete Launch Template
      amazon.aws.ec2_launch_template:
        name: "{{ project_name }}-lt"
        region: "{{ region }}"
        state: absent
      ignore_errors: true

    - name: Delete RDS instance
      amazon.aws.rds_instance:
        db_instance_identifier: "{{ project_name }}-mysql"
        region: "{{ region }}"
        state: absent
        skip_final_snapshot: true
        wait: true
      ignore_errors: true

    - name: Delete RDS subnet group
      amazon.aws.rds_subnet_group:
        name: "{{ project_name }}-db-subnet-group"
        region: "{{ region }}"
        state: absent
      ignore_errors: true

    - name: Delete S3 bucket
      amazon.aws.s3_bucket:
        name: "{{ bucket_name }}"
        region: "{{ region }}"
        state: absent
        force: true
      ignore_errors: true

    - name: Delete IAM instance profile
      amazon.aws.iam_instance_profile:
        name: "{{ project_name }}-profile"
        state: absent
      ignore_errors: true

    - name: Delete IAM role
      amazon.aws.iam_role:
        name: "{{ project_name }}-ec2-role"
        state: absent
      ignore_errors: true

    - name: Get VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ project_name }}-vpc"
      register: vpc_info

    - name: Set VPC ID
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_info.vpcs[0].id }}"
      when: vpc_info.vpcs | length > 0

    - name: Get NAT Gateway information
      amazon.aws.ec2_vpc_nat_gateway_info:
        region: "{{ region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: nat_info
      when: vpc_info.vpcs | length > 0
      ignore_errors: true

    - name: Delete NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        nat_gateway_id: "{{ item.nat_gateway_id }}"
        region: "{{ region }}"
        state: absent
        wait: true
      loop: "{{ nat_info.result | default([]) }}"
      when: nat_info is defined
      ignore_errors: true

    - name: Get route tables
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: route_tables
      when: vpc_info.vpcs | length > 0
      ignore_errors: true

    - name: Delete custom route tables
      amazon.aws.ec2_vpc_route_table:
        route_table_id: "{{ item.id }}"
        region: "{{ region }}"
        state: absent
      loop: "{{ route_tables.route_tables | default([]) }}"
      when:
        - route_tables is defined
        - item.associations | selectattr('main', 'defined') | selectattr('main', 'equalto', true) | list | length == 0
      ignore_errors: true

    - name: Delete security groups
      amazon.aws.ec2_security_group:
        name: "{{ item }}"
        region: "{{ region }}"
        vpc_id: "{{ vpc_id }}"
        state: absent
      loop:
        - "{{ project_name }}-rds-sg"
        - "{{ project_name }}-ec2-sg"
        - "{{ project_name }}-alb-sg"
      when: vpc_info.vpcs | length > 0
      ignore_errors: true

    - name: Delete subnets
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ item }}"
        region: "{{ region }}"
        state: absent
      loop:
        - "10.0.1.0/24"
        - "10.0.2.0/24"
        - "10.0.3.0/24"
        - "10.0.4.0/24"
      when: vpc_info.vpcs | length > 0
      ignore_errors: true

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        region: "{{ region }}"
        state: absent
      when: vpc_info.vpcs | length > 0
      ignore_errors: true

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ project_name }}-vpc"
        cidr_block: "10.0.0.0/16"
        region: "{{ region }}"
        state: absent
      ignore_errors: true
